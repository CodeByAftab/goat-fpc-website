<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>OG Image - Goat FPC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 60px;
    }
    .logo-icon {
      font-size: 120px;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 72px;
      font-weight: 700;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    h1 span {
      color: #90EE90;
    }
    p {
      font-size: 32px;
      opacity: 0.9;
      max-width: 800px;
      line-height: 1.4;
    }
    .accent-line {
      width: 200px;
      height: 6px;
      background: #90EE90;
      margin: 30px auto;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-icon">&#x1F410;</div>
    <h1>Goat <span>FPC</span></h1>
    <div class="accent-line"></div>
    <p>Empowering Farmers Through Goat Livestock Development</p>
  </div>
</body>
</html>
