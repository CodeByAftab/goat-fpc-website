<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Goat head icon -->
  <g fill="#2d5016">
    <!-- Head -->
    <ellipse cx="32" cy="38" rx="16" ry="18"/>
    <!-- Left horn -->
    <path d="M18 22 Q12 8 8 12 Q14 20 20 24Z"/>
    <!-- Right horn -->
    <path d="M46 22 Q52 8 56 12 Q50 20 44 24Z"/>
    <!-- Left ear -->
    <ellipse cx="14" cy="30" rx="6" ry="4" transform="rotate(-20 14 30)"/>
    <!-- Right ear -->
    <ellipse cx="50" cy="30" rx="6" ry="4" transform="rotate(20 50 30)"/>
    <!-- Eyes -->
    <circle cx="24" cy="34" r="3" fill="#1a1a1a"/>
    <circle cx="40" cy="34" r="3" fill="#1a1a1a"/>
    <!-- Eye highlights -->
    <circle cx="25" cy="33" r="1" fill="#fff"/>
    <circle cx="41" cy="33" r="1" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="32" cy="44" rx="6" ry="4" fill="#8b4513"/>
    <!-- Nostrils -->
    <circle cx="29" cy="44" r="1.5" fill="#1a1a1a"/>
    <circle cx="35" cy="44" r="1.5" fill="#1a1a1a"/>
    <!-- Mouth line -->
    <path d="M28 48 Q32 52 36 48" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    <!-- Beard -->
    <path d="M28 50 Q24 60 20 58 Q24 52 28 50Z"/>
    <path d="M36 50 Q40 60 44 58 Q40 52 36 50Z"/>
  </g>
</svg>
